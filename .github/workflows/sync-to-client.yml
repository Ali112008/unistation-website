name: Sync to Client Repo

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Push to UniStation GitHub
    runs-on: ubuntu-latest
    if: github.repository != 'UniStation/unistation-website'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      - name: Push to client repo
        run: |
          git config --global user.name "UniStation Sync"
          git config --global user.email "info@unistation.org"
          git remote add client git@github.com:UniStation/unistation-website.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" git push client main --force
          echo "Synced to GitHub successfully"

      - name: Trigger Vercel Deploy
        run: |
          curl -s -X POST "https://api.vercel.com/v1/integrations/deploy" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "git", "repoName": "UniStation/unistation-website", "branch": "main"}' || true
