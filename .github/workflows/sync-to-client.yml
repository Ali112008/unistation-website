name: Sync to Client Repo

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Push to UniStation GitHub
    runs-on: ubuntu-latest
    if: github.repository != 'UniStation/unistation-website'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      - name: Push to client repo
        run: |
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
          export GIT_AUTHOR_NAME="UniStation"
          export GIT_AUTHOR_EMAIL="309199471+UniStation@users.noreply.github.com"
          export GIT_COMMITTER_NAME="UniStation"
          export GIT_COMMITTER_EMAIL="309199471+UniStation@users.noreply.github.com"
          ' HEAD
          git remote add client git@github.com:UniStation/unistation-website.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" git push client main --force
          echo "Synced to UniStation/unistation-website successfully"
